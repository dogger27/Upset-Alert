# staging.upsetalert.ca — same image, same code, different configuration.
#
# Deliberately NOT a separate repository or a separate branch. Staging exists to
# run exactly what production will run; the only thing that may differ is
# configuration, so that "transfer to production" is a promotion rather than a
# merge.
#
#   docker compose -f docker-compose.staging.yml up -d --build
#
# THE `name:` BELOW IS LOAD-BEARING — DO NOT REMOVE IT.
# Compose derives a project name from the directory, so both this file and
# docker-compose.yml resolved to project "app". Both also define a service
# called `backend`, so bringing staging up made compose believe the running
# production container WAS this service under a new configuration: it
# recreated app-backend-1 as staging-backend and took the live site down with
# a 502 until production was brought back by hand. Naming the project is what
# keeps the two sets of containers from claiming each other.
#
# Differences from production, and why each one:
#
#   port 8002        so it can sit beside production's 8001 on the same host
#   staging-data/    its own database — see the volume note below
#   ENVIRONMENT      development, so the Wikipedia / Tennis Explorer / ESPN
#                    scrapers stay OFF. A second instance scraping the same
#                    sources would double the load on services production
#                    depends on, and Wikipedia rate-limits.
#   SOFASCORE_LIVE_* on, because this is the thing staging is for. Independent
#                    of ENVIRONMENT precisely so it can run without the rest.
#   OUTBOUND_*       off. This database is a copy of production and holds every
#                    real address and push subscription.
name: upsetalert-staging

services:
  backend:
    build: ./backend
    container_name: staging-backend
    restart: unless-stopped
    ports:
      # localhost for cloudflared, which dials the tunnel ingress at
      # http://localhost:8002.
      - "127.0.0.1:8002:8001"
      # ...and Jupiter's Tailscale address, so any device on the tailnet can
      # reach staging WITHOUT DNS. That mattered immediately: a carrier resolver
      # cached NXDOMAIN for staging.upsetalert.ca before the record existed and
      # kept serving it, and Tailscale MagicDNS forwards to whatever the network
      # hands it — so the hostname was unreachable from the laptop while being
      # perfectly resolvable everywhere else.
      #
      # Not a public exposure: the tailnet is private to this account, which
      # makes it a tighter audience than the Cloudflare hostname, not a wider
      # one. Hard-coded because a Tailscale IP is stable for the life of the
      # node.
      - "100.74.46.52:8002:8001"
    volumes:
      # The DIRECTORY, never the .db file — SQLite in WAL mode writes sibling
      # -wal/-shm files next to the database, and a single-file mount strands
      # them in the container layer where the next recreate discards them. This
      # cost production a silent rollback on every deploy once already; staging
      # gets the same rule rather than a fresh lesson.
      - /home/paulwiens/upsetalert/staging-data:/data
      - /home/paulwiens/upsetalert/staging-logs:/logs
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/tennis_fantasy.db
      - LOG_FILE=/logs/backend.log
      # Its own key. Sharing production's would make staging-issued session
      # tokens valid on the live site.
      - SECRET_KEY=${STAGING_SECRET_KEY:?set STAGING_SECRET_KEY in the .env beside this file}
      # No Resend key and no VAPID keys: nothing to send with, on top of the
      # switch below. Two independent reasons a staging box cannot reach a user.
      - RESEND_API_KEY=
      - VAPID_PUBLIC_KEY=
      - VAPID_PRIVATE_KEY=
      - ENVIRONMENT=development
      - OUTBOUND_NOTIFICATIONS=false
      - SOFASCORE_LIVE_ENABLED=true
      - SOFASCORE_LIVE_FORCE=true
      # Shadow results sweep — writes sofa_* columns only, so ESPN and Sofascore
      # can be diffed over a real tournament before either is trusted to own a
      # winner. See scripts/sofa_diff.py.
      - SOFASCORE_RESULTS_ENABLED=true
      # Serve Sofascore's results instead of ESPN's. This is what makes staging
      # a real test of "could Sofascore carry this alone" rather than a copy of
      # production with an extra column — ESPN does not run here at all, so its
      # own columns are frozen at seed time and must not be read.
      - SOFASCORE_AUTHORITATIVE=true
      # Score doubles too. They have no draw and never will; this fills in the
      # rows on the order of play that ESPN could never bring to life.
      - SOFASCORE_DOUBLES_ENABLED=true
      # The order of play is what this environment exists to test, and with the
      # scrapers off its schedule froze on the day the database was seeded.
      # These are static PDFs on the tours' own hosts, not the rate-limited
      # sources the other scrapers use.
      - ORDER_OF_PLAY_ENABLED=true
      # Where Sofascore requests leave from. Empty means direct, which is
      # correct once Jupiter's own IP is out of the penalty box; until then it
      # points at an SSH SOCKS tunnel to a machine on another network.
      - SOFASCORE_PROXY=${SOFASCORE_PROXY:-}
    extra_hosts:
      # So SOFASCORE_PROXY can name the docker gateway for a host-side tunnel.
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # The front door. staging.upsetalert.ca is the only hostname with a DNS
  # record, so one process both serves the built app and gives it an API to
  # call — see staging/web-server.py for why those are the same process.
  #
  # It is HERE, and not a shell job, because a shell job is invisible: nothing
  # described it, nothing restarted it, and it was parented to whichever
  # terminal session started it. The backend beside it restarts on its own and
  # survives a reboot; this did not, and a live API behind a dead front door
  # looks exactly like a deploy that broke the site.
  web:
    image: python:3.11-slim
    container_name: staging-web
    restart: unless-stopped
    # Stock image, stdlib script, no build step — so there is nothing to
    # rebuild when the frontend changes, and nothing to forget to rebuild.
    command: ["python3", "/srv/app/staging/web-server.py"]
    depends_on:
      - backend
    ports:
      # cloudflared runs on the HOST and dials the tunnel ingress at
      # localhost:8003, so this has to land on the host's loopback.
      - "127.0.0.1:8003:8003"
      # And the tailnet, for the same reason the backend publishes there: a
      # device that cannot resolve the hostname can still reach the box.
      - "100.74.46.52:8003:8003"
    volumes:
      # DIRECTORIES, not files. The built app is rsynced into this one with
      # --delete on every deploy, which replaces inodes — a file mount would
      # point at whatever was there when the container started and never see
      # another deploy again. Read-only: this process serves the build, it does
      # not produce it.
      - /home/paulwiens/upsetalert/staging-web:/srv/web:ro
      - ./staging:/srv/app/staging:ro
    environment:
      - STAGING_WEB_ROOT=/srv/web
      - STAGING_WEB_PORT=8003
      # By service name on the compose network, not through the host's
      # published port — the container's own 127.0.0.1 is itself, and routing
      # back out to the host to reach a container on the same network would be
      # a longer path to the same place.
      - STAGING_BACKEND_URL=http://backend:8001
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/index.html', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
