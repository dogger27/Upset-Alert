<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is not cosmetic: without it env(safe-area-inset-*)
         resolves to 0 on every iPhone, so the rules written against it (the
         install sheet's bottom padding among them) have quietly been doing
         nothing. initial-scale=1 stays, and pinch-zoom stays allowed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Installed-app identity. scope:"/" in the manifest is what lets Chrome on
         Android mint a WebAPK and capture upsetalert.ca links device-wide;
         handle_links + launch_handler there decide that an emailed link reuses
         the open window instead of stacking a new one. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c9783a" />

    <!-- iOS ignores the manifest's display mode before 17.4 and never captures
         links at all, so these only control how a Home Screen launch looks.
         apple-mobile-web-app-capable is the legacy spelling of display:standalone
         and is still what older iOS reads; mobile-web-app-capable is the standard
         one. apple-mobile-web-app-title stops iOS falling back to the page
         title, which is long enough to be truncated under the icon. Never
         write a literal title tag inside a comment here: WhatsApp's link
         scraper does not parse comments, found one, and rendered the rest of
         this paragraph as the site's preview text. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Upset Alert" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Saira+Condensed:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Upset Alert</title>

    <!-- Link previews (WhatsApp, iMessage, Slack, X). Absolute URLs only:
         scrapers resolve nothing. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Upset Alert" />
    <meta property="og:title" content="Upset Alert — Your Wildest Fantasy Tennis" />
    <meta property="og:description" content="Pick every match of ATP and WTA draws, score points for calling upsets, and follow live scores with your league." />
    <meta property="og:url" content="https://upsetalert.ca/" />
    <!-- 192px, deliberately: WhatsApp gives an image ~300px or larger on
         both sides the full-width banner treatment; a smaller one renders as
         the compact thumbnail beside the title, which is the card we want. -->
    <meta property="og:image" content="https://upsetalert.ca/favicon-192x192.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="description" content="Pick every match of ATP and WTA draws, score points for calling upsets, and follow live scores with your league." />

    <!-- Paint the theme before the first frame.
         Doing this from React would mean the light palette renders once and is
         repainted dark a beat later — the white flash every dark-mode site is
         judged by. It must run synchronously in <head>, ahead of the stylesheet,
         so the attribute is on <html> when styles resolve.
         A FILE, not an inline block: our CSP sets script-src 'self' with no
         'unsafe-inline', so an inline script is blocked and silently does
         nothing. No defer/async/type=module — those all postpone it past the
         first paint, which is the whole thing we are avoiding. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
